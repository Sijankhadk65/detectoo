[project]
name = "detectoo-api"
version = "0.1.0"
description = "Lean FastAPI backend for Detectoo (auth + plant-care domain models). Development scaffold."
authors = [{ name = "Sijan Khadka" }]
requires-python = ">=3.11, <4"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "python-jose>=3.3.0",
    "bcrypt>=4.2.0",
    "SQLAlchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "greenlet>=3.0.0",
    "alembic>=1.13.1",
    "fastcrud>=0.19.2",
    "uuid6>=2024.1.12",
    "anthropic>=0.102.0",
    "resend>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.app.*"
disallow_untyped_defs = true
