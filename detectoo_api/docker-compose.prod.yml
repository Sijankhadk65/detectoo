services:
  db:
    image: postgres:16-alpine
    container_name: detectoo_prod_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-detectoo_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-detectoo_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: detectoo_prod_web
    env_file: ./src/.env.prod
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      SERVER_URL: "https://api.detectoo.tech"
      UPLOADS_DIR: "/app/uploads"
      ENVIRONMENT: "production"
    ports:
      - "8000:8000"
    volumes:
      - uploads_prod_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_prod_data:
  uploads_prod_data:
