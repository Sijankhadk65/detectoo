services:
  db:
    image: postgres:16-alpine
    container_name: detectoo_api_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-detectoo}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-detectoo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: detectoo_api_adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Containerized API. Guarded by the `server` profile so local dev
  # (`docker compose up -d db`) keeps running uvicorn on the host.
  # Server deploy:  docker compose --profile server up -d --build
  web:
    profiles: ["server"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: detectoo_api_web
    env_file: ./src/.env
    environment:
      # Override .env values so the API talks to Postgres over the compose
      # network instead of localhost:5433.
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      SERVER_URL: "https://api.detectoo.tech"
      UPLOADS_DIR: "/app/uploads"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
