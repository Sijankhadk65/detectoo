services:
  db:
    image: postgres:16-alpine
    container_name: detectoo_dev_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-detectoo_dev}
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-detectoo_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: detectoo_dev_adminer
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: detectoo_dev_web
    env_file: ./src/.env.dev
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      SERVER_URL: "https://dev.detectoo.tech"
      UPLOADS_DIR: "/app/uploads"
      ENVIRONMENT: "staging"
    ports:
      - "8001:8000"
    volumes:
      - uploads_dev_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_dev_data:
  uploads_dev_data:
